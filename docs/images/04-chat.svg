<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#e9edf3"/>
  <rect x="290" y="20" width="380" height="500" rx="10" fill="#f5f6f8" stroke="#d9dce1"/>
  <rect x="290" y="20" width="380" height="52" rx="10" fill="#fff"/><circle cx="311" cy="45" r="6" fill="#34c759"/>
  <text x="328" y="50" fill="#1f2329" font-size="15" font-weight="600" font-family="Microsoft YaHei,sans-serif">浏览器 AI 助手</text><text x="550" y="50" fill="#34c759" font-size="12" font-family="Microsoft YaHei,sans-serif">已连接</text>
  <text x="312" y="100" fill="#8a9099" font-size="12" font-family="Microsoft YaHei,sans-serif">我是浏览器 AI 助手，可以读取页面、点击、输入和打开网页。</text>
  <rect x="382" y="127" width="260" height="54" rx="12" fill="#3478f6"/><text x="401" y="160" fill="#fff" font-size="14" font-family="Microsoft YaHei,sans-serif">请总结一下当前页面</text>
  <text x="312" y="213" fill="#8a9099" font-size="12" font-family="Microsoft YaHei,sans-serif">正在读取页面内容…</text>
  <rect x="312" y="232" width="326" height="102" rx="10" fill="#fff" stroke="#e5e6eb"/>
  <text x="330" y="260" fill="#1f2329" font-size="14" font-family="Microsoft YaHei,sans-serif">页面主要介绍了浏览器 AI 助手，</text><text x="330" y="286" fill="#1f2329" font-size="14" font-family="Microsoft YaHei,sans-serif">支持通过自然语言执行网页操作。</text><text x="330" y="312" fill="#1f2329" font-size="14" font-family="Microsoft YaHei,sans-serif">需要我继续操作吗？</text>
