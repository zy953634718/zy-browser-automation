<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>浏览器 AI 助手</title>
  <style>
    * { box-sizing: border-box; }
    :root { --blue:#3478f6; --bg:#f5f6f8; --line:#e5e6eb; --muted:#8a9099; --ink:#1f2329; }
    body { margin:0; min-width:300px; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
    .header { padding:10px 12px 8px; background:#fff; border-bottom:1px solid var(--line); }
    .title-row { display:flex; align-items:center; gap:8px; }
    .dot { width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:#bbb; }
    .dot.connected { background:#34c759; }.dot.connecting { background:#ff9500; }.dot.error,.dot.disconnected { background:#ff3b30; }
    .title { font-weight:600; flex:1; }.status { color:#646a73; font-size:12px; }
    .icon-btn,.new-btn { border:0; cursor:pointer; border-radius:6px; font:inherit; }
    .icon-btn { padding:3px 5px; background:transparent; color:#646a73; font-size:16px; }.icon-btn:hover { background:#f0f1f3; }
    .new-btn { padding:5px 9px; color:#fff; background:var(--blue); font-size:12px; }.new-btn:hover { background:#2b68d9; }
    .history-row { display:flex; align-items:center; gap:7px; margin-top:9px; }
    .history-row label { color:var(--muted); font-size:12px; }
    #conversationSelect { min-width:0; flex:1; padding:5px 6px; border:1px solid #d9dce1; border-radius:6px; background:#fff; color:var(--ink); font:inherit; }
    .messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:9px; }
    .task-plan { margin:9px 10px 0; padding:9px 10px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 2px #00000008; }
    .task-plan[hidden] { display:none; }.plan-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .plan-head strong { flex:1; font-size:12px; }.plan-status { color:var(--muted); font-size:11px; }
    .plan-steps { display:flex; flex-direction:column; gap:4px; margin:0; padding:0; list-style:none; }
    .plan-step { display:flex; gap:6px; align-items:flex-start; color:#646a73; font-size:12px; }
    .plan-step .step-icon { width:15px; flex:0 0 15px; text-align:center; }.plan-step.running { color:var(--blue); font-weight:600; }.plan-step.completed { color:#138a4b; }.plan-step.failed { color:#cf1322; }
    .plan-detail { display:block; color:var(--muted); font-size:11px; font-weight:400; }
    .welcome { padding:12px 8px; color:var(--muted); text-align:center; font-size:12px; }
    .msg { max-width:91%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
    .msg.user { align-self:flex-end; color:#fff; background:var(--blue); border-bottom-right-radius:3px; }
    .msg.assistant { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:3px; }
    .msg.error { align-self:flex-start; color:#a8071a; background:#fff1f0; border:1px solid #ffccc7; }
    .tool-row { color:var(--muted); font-size:12px; padding:1px 4px; }
    .input-row { display:flex; gap:7px; padding:9px 10px; background:#fff; border-top:1px solid var(--line); }
    textarea { min-height:38px; max-height:120px; flex:1; resize:none; padding:8px 9px; border:1px solid #d9dce1; border-radius:8px; outline:none; font:inherit; }
    textarea:focus { border-color:var(--blue); }.send-btn,.stop-btn { border:0; border-radius:8px; padding:0 12px; color:#fff; cursor:pointer; font:inherit; }.send-btn { background:var(--blue); }.stop-btn { background:#ff4d4f; }.send-btn:disabled,.stop-btn:disabled { background:#b7c8ef; cursor:not-allowed; }
    .empty-history { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-row">
      <span id="statusDot" class="dot disconnected"></span>
      <span class="title">浏览器 AI 助手</span>
      <span id="statusText" class="status">未连接</span>
      <button id="settingsButton" class="icon-btn" title="设置">⚙</button>
    </div>
    <div class="history-row">
      <label for="conversationSelect">历史对话</label>
      <select id="conversationSelect" aria-label="选择历史对话"></select>
      <button id="newConversation" class="new-btn">＋ 新对话</button>
    </div>
  </header>
  <section id="taskPlan" class="task-plan" hidden aria-live="polite"></section>
  <main id="messages" class="messages" aria-live="polite"></main>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="输入指令，Enter 发送；Shift+Enter 换行"></textarea>
    <button id="send" class="send-btn" disabled>发送</button>
    <button id="stop" class="stop-btn" disabled>停止</button>
  </div>
  <script src="side_panel.js"></script>
</body>
</html>
